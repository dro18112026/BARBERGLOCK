<h2>Crear una contraseña nueva</h2>

<p>Pediste crear una contraseña nueva para el panel de la barbería.</p>

<p>
  <a href="{{ .SiteURL }}/admin/recuperar/link?token_hash={{ .TokenHash }}&type=recovery">
    Crear contraseña nueva
  </a>
</p>

<p>El link dura 1 hora y sirve una sola vez. Si no lo pediste tú, ignora este correo: tu contraseña no cambia.</p>
