# Pings the site's health endpoint every day so the Supabase free tier
# doesn't pause the project after a week without traffic.
#
# Setup: GitHub repo → Settings → Secrets and variables → Actions → Variables
#        → New repository variable  SITE_URL = https://<your-site>.netlify.app
#
# Note: GitHub disables scheduled workflows after 60 days without repo
# activity; it emails a warning and one click re-enables it.
name: Keep alive

on:
  schedule:
    - cron: "17 12 * * *" # every day, 12:17 UTC (09:17 in Chile Chico)
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/health
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "SITE_URL repository variable is not set; skipping."
            exit 0
          fi
          curl --fail --silent --show-error --retry 3 --retry-delay 10 "$SITE_URL/api/health"
